databases:
  - name: bookora-db
    databaseName: bookora
    user: bookora
    plan: free

services:
  - type: web
    name: bookora
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn bookora.wsgi --log-file -"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bookora-db
          property: connectionString
